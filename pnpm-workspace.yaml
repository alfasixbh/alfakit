packages:
  - packages/*
  - playground/*
  - docs
  - demo
  - e2e

publicHoistPattern:
  - '@inertiajs/core'

onlyBuiltDependencies:
  - esbuild
  - '@tailwindcss/oxide'
  - '@rolldown/binding-darwin-arm64'

minimumReleaseAgeExclude:
  - '@lucide/svelte@1.53.0'

overrides:
  # Security fixes for dev tooling (GHSA-85c8-ppgw-ccpr and friends, GHSA-pqg4-j6r4-53mv).
  tinypool: ^2.1.2
  shell-quote: ^1.11.0
