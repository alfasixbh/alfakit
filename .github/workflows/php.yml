name: PHP

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pest (PHP ${{ matrix.php }}, ${{ matrix.stability }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        stability: [prefer-lowest, prefer-stable]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd
          coverage: pcov
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.stability }}
          composer-options: --prefer-dist --no-progress
      - run: vendor/bin/pest --test-directory=packages/alfakit/tests --ci --coverage --min=80
      - name: Language packs mirror English
        run: vendor/bin/pest --test-directory=packages/translations/tests packages/translations/tests --ci

  lint:
    name: Pint + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=2G --error-format=github
