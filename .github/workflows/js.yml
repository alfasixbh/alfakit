name: JavaScript

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: js-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build first: the renderers type-check against the built @alfakit/core declarations,
      # and the hydration and plugin tests import built packages.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 7
