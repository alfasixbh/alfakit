name: Split PHP package

# Mirrors the PHP packages to the read-only repositories Packagist tracks, on every
# push to main and on every tag:
#   packages/alfakit      -> alfasixbh/alfakit-php
#   packages/translations -> alfasixbh/alfakit-translations
#
# Runs only once the repository variable RELEASES_ENABLED is "true" and the SPLIT_TOKEN
# secret can push to those repositories.

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  split:
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - { directory: packages/alfakit, repository: alfakit-php }
          - { directory: packages/translations, repository: alfakit-translations }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: symplify/monorepo-split-github-action@v2.3.0
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          package_directory: ${{ matrix.package.directory }}
          repository_organization: alfasixbh
          repository_name: ${{ matrix.package.repository }}
          user_name: alfakit-bot
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
      - uses: symplify/monorepo-split-github-action@v2.3.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag: ${{ github.ref_name }}
          package_directory: ${{ matrix.package.directory }}
          repository_organization: alfasixbh
          repository_name: ${{ matrix.package.repository }}
          user_name: alfakit-bot
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
